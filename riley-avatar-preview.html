<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riley PM Bot Avatar</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #1F2937;
            margin: 0 0 20px 0;
        }
        p {
            color: #6B7280;
            margin: 0 0 30px 0;
        }
        svg {
            width: 200px;
            height: 200px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
        }
        .description {
            margin-top: 30px;
            font-size: 14px;
            color: #4B5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Riley - PM Bot Avatar</h1>
        <p>Professional Project Manager for Your Team</p>

        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <circle cx="100" cy="100" r="100" fill="#3B82F6"/>

            <!-- Head -->
            <circle cx="100" cy="70" r="35" fill="#FCD34D"/>

            <!-- Eyes -->
            <circle cx="90" cy="65" r="4" fill="#1F2937"/>
            <circle cx="110" cy="65" r="4" fill="#1F2937"/>

            <!-- Smile -->
            <path d="M 90 75 Q 100 82 110 75" stroke="#1F2937" stroke-width="2" fill="none" stroke-linecap="round"/>

            <!-- Body (PM Style - Business) -->
            <rect x="65" y="105" width="70" height="50" fill="#1F2937" rx="5"/>

            <!-- Shirt -->
            <rect x="75" y="110" width="50" height="25" fill="#EF4444" rx="3"/>

            <!-- Badge/Pin (PM) -->
            <circle cx="155" cy="125" r="8" fill="#10B981"/>
            <text x="155" y="130" font-size="10" font-weight="bold" fill="white" text-anchor="middle" alignment-baseline="middle">PM</text>

            <!-- Arms -->
            <rect x="50" y="115" width="15" height="35" fill="#FCD34D" rx="7"/>
            <rect x="135" y="115" width="15" height="35" fill="#FCD34D" rx="7"/>
        </svg>

        <div class="description">
            <p><strong>Riley</strong> — A friendly, professional PM bot<br/>
            Blue background (trust & tech), PM badge, business-focused<br/>
            Ready to respond to your team in Google Chat</p>
        </div>
    </div>
</body>
</html>
